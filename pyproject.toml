[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-receipt-printer"
version = "1.0.0"
description = "CLI tool for printing to Epson TM-T88V thermal receipt printers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Alex Baldwin"}
]
keywords = ["thermal", "printer", "receipt", "escpos", "cli", "markdown"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Printing",
]
dependencies = [
    "python-escpos>=3.0",
    "pillow>=10.0",
    "numpy>=1.24",
    "requests>=2.28",
]

[project.scripts]
receipt = "cli:main"

[project.urls]
Homepage = "https://github.com/alexbaldwin/thermal-receipt-printer"

[tool.setuptools]
py-modules = ["cli", "printer_utils", "image_utils"]
